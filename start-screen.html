<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome to Birthday Island 🎂</title>

<!-- Cute Gaming Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Cherry+Bomb+One&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

/* =========================
   GENERAL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: "Baloo 2", sans-serif;
    background: #8ed8f8;
}

/* =========================
   ISLAND BACKGROUND
========================= */

.game-screen {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Sky */

.sky {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to bottom,
            #72c9f5 0%,
            #9de0f7 55%,
            #c8f1ff 100%
        );
    z-index: 0;
}

/* =========================
   SUN
========================= */

.sun {
    position: absolute;
    width: 110px;
    height: 110px;
    background: #fff3a3;
    border-radius: 50%;
    top: 70px;
    right: 12%;
    box-shadow:
        0 0 30px #fff3a3,
        0 0 70px rgba(255, 243, 163, 0.6);
    animation: sunGlow 3s ease-in-out infinite alternate;
}

@keyframes sunGlow {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.08);
    }
}

/* =========================
   CLOUDS
========================= */

.cloud {
    position: absolute;
    background: white;
    border-radius: 50px;
    opacity: 0.9;
    z-index: 2;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud-1 {
    width: 160px;
    height: 45px;
    top: 100px;
    left: -180px;
    animation: cloudMove 28s linear infinite;
}

.cloud-1::before {
    width: 65px;
    height: 65px;
    left: 25px;
    bottom: 15px;
}

.cloud-1::after {
    width: 85px;
    height: 85px;
    right: 25px;
    bottom: 10px;
}

.cloud-2 {
    width: 130px;
    height: 38px;
    top: 220px;
    left: -150px;
    opacity: 0.75;
    animation: cloudMove 35s linear infinite;
    animation-delay: 5s;
}

.cloud-2::before {
    width: 55px;
    height: 55px;
    left: 20px;
    bottom: 10px;
}

.cloud-2::after {
    width: 70px;
    height: 70px;
    right: 20px;
    bottom: 8px;
}

@keyframes cloudMove {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(calc(100vw + 400px));
    }
}

/* =========================
   STARS
========================= */

.star {
    position: absolute;
    color: white;
    font-size: 22px;
    z-index: 2;
    animation: twinkle 2s ease-in-out infinite;
}

.star-1 {
    top: 15%;
    left: 15%;
}

.star-2 {
    top: 28%;
    right: 18%;
    animation-delay: 0.5s;
}

.star-3 {
    top: 12%;
    right: 35%;
    animation-delay: 1s;
}

.star-4 {
    top: 38%;
    left: 8%;
    animation-delay: 1.5s;
}

@keyframes twinkle {
    0%, 100% {
        opacity: 0.3;
        transform: scale(0.8);
    }

    50% {
        opacity: 1;
        transform: scale(1.2);
    }
}

/* =========================
   BUTTERFLIES
========================= */

.butterfly {
    position: absolute;
    font-size: 28px;
    z-index: 5;
    animation: butterflyFloat 6s ease-in-out infinite;
}

.butterfly-1 {
    left: 15%;
    top: 45%;
}

.butterfly-2 {
    right: 15%;
    top: 48%;
    animation-delay: 2s;
}

@keyframes butterflyFloat {
    0%, 100% {
        transform: translateY(0) rotate(-5deg);
    }

    50% {
        transform: translateY(-30px) rotate(8deg);
    }
}

/* =========================
   ISLAND
========================= */

.island {
    position: absolute;
    width: 100%;
    height: 45%;
    bottom: -8%;
    left: 0;
    background: #79c85b;
    border-radius: 50% 50% 0 0;
    z-index: 3;
    box-shadow: inset 0 20px 0 rgba(255,255,255,0.15);
}

/* Sand */

.sand {
    position: absolute;
    width: 75%;
    height: 75%;
    bottom: -25%;
    left: 12%;
    background: #f9dc91;
    border-radius: 50%;
    z-index: 4;
}

/* Ocean */

.ocean {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 25%;
    background: #54bce8;
    z-index: 1;
}

/* Ocean waves */

.wave {
    position: absolute;
    width: 100%;
    height: 20px;
    background: rgba(255,255,255,0.35);
    border-radius: 50%;
    animation: waveMove 5s ease-in-out infinite;
}

.wave-1 {
    top: 20px;
}

.wave-2 {
    top: 60px;
    animation-delay: 1s;
}

.wave-3 {
    top: 100px;
    animation-delay: 2s;
}

@keyframes waveMove {
    0%,100% {
        transform: translateX(-20px);
    }

    50% {
        transform: translateX(20px);
    }
}

/* =========================
   PALM TREES
========================= */

.palm {
    position: absolute;
    font-size: 90px;
    z-index: 6;
    animation: palmSway 4s ease-in-out infinite;
}

.palm-1 {
    left: 8%;
    bottom: 18%;
}

.palm-2 {
    right: 7%;
    bottom: 15%;
    animation-delay: 1s;
}

@keyframes palmSway {
    0%,100% {
        transform: rotate(-2deg);
    }

    50% {
        transform: rotate(3deg);
    }
}

/* =========================
   GAME UI
========================= */

.game-content {
    position: relative;
    z-index: 10;
    width: min(650px, 90%);
    text-align: center;
    margin-bottom: 10vh;
}

/* Small title */

.welcome {
    color: white;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 3px 3px 0 #2879a4;
    margin-bottom: 8px;
}

/* Main title */

.title {
    font-family: "Lexend / Caveat variants:", cursive;
    font-size: clamp(45px, 7vw, 80px);
    color: white;
    line-height: 1;
    text-shadow:
        5px 5px 0 #3b8bb5,
        8px 8px 0 rgba(0,0,0,0.12);
    margin-bottom: 25px;
    animation: titleBounce 3s ease-in-out infinite;
}

@keyframes titleBounce {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

/* =========================
   GAME BOX
========================= */

.game-box {
    background: rgba(255,255,255,0.92);
    border: 5px solid #ffffff;
    border-radius: 28px;
    padding: 25px 30px;
    box-shadow:
        0 12px 0 #4a9cc2,
        0 20px 40px rgba(0,0,0,0.18);
    margin: auto;
    max-width: 560px;
}

/* Player information */

.player-info {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 22px;
}

.info-line {
    background: #e9f8ff;
    border-radius: 14px;
    padding: 10px 15px;
    color: #28749b;
    font-weight: 800;
    font-size: 18px;
    border: 2px solid #b9e8f9;
}

.info-line span {
    color: #f58aaa;
}

/* =========================
   STORY TEXT
========================= */

.story {
    margin: 20px 0;
    color: #666;
    font-size: 18px;
    line-height: 1.5;
}

.story .special {
    color: #f0789d;
    font-weight: 800;
    font-size: 20px;
}

/* =========================
   START BUTTON
========================= */

.start-button {
    display: inline-block;
    text-decoration: none;
    background: #ff8fb3;
    color: white;
    font-family: "Press Start 2P", cursive;
    font-size: 18px;
    padding: 20px 35px;
    border-radius: 18px;
    border: 4px solid white;
    box-shadow:
        0 7px 0 #d85f86,
        0 12px 20px rgba(0,0,0,0.15);
    cursor: pointer;
    transition: all 0.15s ease;
    animation: buttonPulse 2s ease-in-out infinite;
}

.start-button:hover {
    transform: translateY(4px) scale(1.03);
    box-shadow:
        0 3px 0 #d85f86,
        0 8px 15px rgba(0,0,0,0.15);
    background: #ff78a2;
}

.start-button:active {
    transform: translateY(7px);
    box-shadow: none;
}

@keyframes buttonPulse {
    0%,100% {
        box-shadow:
            0 7px 0 #d85f86,
            0 12px 20px rgba(0,0,0,0.15);
    }

    50% {
        box-shadow:
            0 7px 0 #d85f86,
            0 12px 30px rgba(255,143,179,0.5);
    }
}

/* =========================
   FOOTER
========================= */

.press-start {
    margin-top: 18px;
    color: #8a8a8a;
    font-size: 13px;
    letter-spacing: 1px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 600px) {

    .game-content {
        margin-bottom: 12vh;
    }

    .game-box {
        padding: 20px 15px;
    }

    .info-line {
        font-size: 15px;
    }

    .story {
        font-size: 16px;
    }

    .start-button {
        font-size: 14px;
        padding: 17px 22px;
    }

    .palm {
        font-size: 60px;
    }

    .sun {
        width: 75px;
        height: 75px;
    }
}

</style>
</head>

<body>

<div class="game-screen">

    <!-- Sky -->
    <div class="sky"></div>

    <!-- Sun -->
    <div class="sun"></div>

    <!-- Clouds -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>

    <!-- Stars -->
    <div class="star star-1">✦</div>
    <div class="star star-2">✧</div>
    <div class="star star-3">✦</div>
    <div class="star star-4">✧</div>

    <!-- Butterflies -->
    <div class="butterfly butterfly-1">🦋</div>
    <div class="butterfly butterfly-2">🦋</div>

    <!-- Ocean -->
    <div class="ocean">
        <div class="wave wave-1"></div>
        <div class="wave wave-2"></div>
        <div class="wave wave-3"></div>
    </div>

    <!-- Island -->
    <div class="island"></div>
    <div class="sand"></div>

    <!-- Palm Trees -->
    <div class="palm palm-1">🌴</div>
    <div class="palm palm-2">🌴</div>


    <!-- MAIN GAME CONTENT -->

    <main class="game-content">

        <div class="welcome">
            ✨ WELCOME TO ✨
        </div>

        <h1 class="title">
            Birthday Island 🌴
        </h1>

        <div class="game-box">

            <div class="player-info">

                <div class="info-line">
                    🎮 PLAYER 1:
                    <span> Mark </span>
                </div>

                <div class="info-line">
                    🎂 LEVEL:
                    <span>BIRTHDAY BOY</span>
                </div>

                <div class="info-line">
                    ❤️ MISSION:
                    <span>COMPLETE YOUR BIRTHDAY ADVENTURE</span>
                </div>

            </div>

            <div class="story">

                ✨ A special island has appeared... ✨

                <br>

                <span class="special">
                    Someone very important is waiting for you. 💗
                </span>

            </div>

            <!-- START GAME -->

            <a href="boarding-pass.html" class="start-button">
                🎮 START GAME
            </a>

            <div class="press-start">
                PRESS START TO BEGIN YOUR ADVENTURE
            </div>

        </div>

    </main>

</div>

</body>
</html>
